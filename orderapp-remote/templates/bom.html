<!doctype html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>BOM配方(最小版)</title><style>body{font-family:system-ui;margin:0}.layout{display:flex;min-height:100vh}.sidebar{width:190px;padding:14px 12px;border-right:1px solid #eee;background:#fafafa;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow:auto}.link{display:block;padding:8px 10px;border-radius:8px;color:#111;text-decoration:none}.link:hover{background:#f0f0f0}.section{margin-top:14px;margin-bottom:6px;font-size:12px;color:#666}.content{flex:1;padding:16px}.card{border:1px solid #eee;border-radius:10px;padding:12px;margin:12px 0}.btn{padding:10px 12px;background:#111;color:#fff;border-radius:8px;border:1px solid #111}.ok{background:#e9ffe9;border:1px solid #b8f5b8;padding:10px;border-radius:8px}.err{background:#ffecec;border:1px solid #ffb9b9;padding:10px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #f1f1f1;padding:8px}</style></head><body><div class="layout"><nav class="sidebar"><div class="section">生产流程</div><a class="link" href="/materials">物料档案/库存</a><a class="link" href="/bom">BOM配方(最小版)</a><a class="link" href="/produce/plan">生产计划</a></nav><main class="content"><h2 style="margin:0">BOM配方（最小可用）</h2>{{if .Ok}}<div class="ok">已保存</div>{{end}}{{if .Err}}<div class="err">{{.Err}}</div>{{end}}<div class="card"><form method="post" action="/bom/save"><div style="display:grid;grid-template-columns:1fr 160px 120px;gap:10px"><div><div style="font-size:12px;color:#666;margin-bottom:6px">成品</div><select name="product_id" style="width:100%;padding:10px"><option value="">选择成品</option>{{range .Products}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></div><div><div style="font-size:12px;color:#666;margin-bottom:6px">出品率(0~1)</div><input name="yield_rate" value="0.8" style="width:100%;padding:10px"/></div><div style="display:flex;align-items:end"><button class="btn" type="submit">保存</button></div></div></form></div><div class="card"><table><thead><tr><th>成品</th><th>出品率</th><th>更新时间</th></tr></thead><tbody>{{range .Rows}}<tr><td>{{.Product}}</td><td>{{.YieldRate}}</td><td>{{.UpdatedAt}}</td></tr>{{end}}{{if not .Rows}}<tr><td colspan="3">暂无记录</td></tr>{{end}}</tbody></table></div></main></div></body></html>
