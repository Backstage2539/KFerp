{{define "company_employees.html"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>员工维护</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;max-width:1080px;margin:24px auto;padding:0 12px;}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{border:1px solid #e5e7eb;padding:8px;text-align:left}
    .ok{background:#e9ffe9;border:1px solid #b8f5b8;padding:8px;border-radius:8px}
    .err{background:#fff1f0;border:1px solid #ffa39e;padding:8px;border-radius:8px}
    .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
    input,select,button{padding:6px 8px}
  </style>
</head>
<body>
  <h2>员工维护</h2>
  {{if .Ok}}<div class="ok">保存成功</div>{{end}}
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}

  <form method="get" action="/company/employees" class="bar">
    <label>按部门筛选</label>
    <select name="department_id">
      <option value="">全部</option>
      {{range .Departments}}
      <option value="{{.ID}}" {{if eq64 $.DepartmentID .ID}}selected{{end}}>{{.Name}}</option>
      {{end}}
    </select>
    <button type="submit">筛选</button>
  </form>

  <div class="bar">
    <input id="name" placeholder="姓名" />
    <input id="phone" placeholder="电话" />
    <input id="dep" type="number" min="1" placeholder="部门ID" />
    <select id="active"><option value="true">启用</option><option value="false">停用</option></select>
    <button id="createBtn" type="button">新增员工</button>
  </div>

  <table>
    <thead><tr><th>ID</th><th>姓名</th><th>电话</th><th>部门</th><th>部门ID</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
      {{range .Items}}
      <tr>
        <td>{{.ID}}</td>
        <td><input id="n{{.ID}}" value="{{.Name}}" /></td>
        <td><input id="p{{.ID}}" value="{{.Phone}}" /></td>
        <td>{{.Department}}</td>
        <td><input id="d{{.ID}}" type="number" min="1" value="{{.DepartmentID}}" /></td>
        <td>
          <select id="a{{.ID}}">
            <option value="true" {{if .Active}}selected{{end}}>启用</option>
            <option value="false" {{if not .Active}}selected{{end}}>停用</option>
          </select>
        </td>
        <td><button type="button" onclick="saveEmp({{.ID}})">保存</button></td>
      </tr>
      {{end}}
    </tbody>
  </table>

<script>
async function saveEmp(id){
  const name=document.getElementById('n'+id).value.trim();
  const phone=document.getElementById('p'+id).value.trim();
  const department_id=Number(document.getElementById('d'+id).value||0);
  const active=document.getElementById('a'+id).value==='true';
  const r=await fetch('/api/company/employees/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,department_id,active})});
  if(r.ok){location.href='/company/employees?ok=1';return;}
  const t=await r.text(); alert(t||'保存失败');
}
document.getElementById('createBtn').onclick=async()=>{
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const department_id=Number(document.getElementById('dep').value||0);
  const active=document.getElementById('active').value==='true';
  const r=await fetch('/api/company/employees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,department_id,active})});
  if(r.ok){location.href='/company/employees?ok=1';return;}
  const t=await r.text(); alert(t||'创建失败');
};
</script>
</body>
</html>
{{end}}
