<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>手机号登录</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0; background:#f7f7f7;}
    .wrap{max-width:420px; margin:40px auto; padding:16px;}
    .card{background:#fff; border:1px solid #eee; border-radius:12px; padding:16px;}
    .row{display:grid; gap:10px;}
    .tabs{display:flex; gap:8px; margin-bottom:12px;}
    .btn{padding:10px 12px; border:1px solid #111; border-radius:8px; background:#111; color:#fff; cursor:pointer;}
    .btn2{padding:10px 12px; border:1px solid #999; border-radius:8px; background:#fff; color:#111; cursor:pointer;}
    .btn2.active{border-color:#111;background:#111;color:#fff;}
    input{padding:10px; font-size:16px; border:1px solid #ddd; border-radius:8px; width:100%; box-sizing:border-box;}
    .muted{font-size:12px;color:#666;}
    .err{color:#c00; font-size:13px;}
    .ok{color:#0a7b27; font-size:13px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h3 style="margin-top:0">手机号登录</h3>
      <div class="tabs">
        <button id="tabPwd" class="btn2 active" type="button" onclick="setMode('password')">手机号+密码</button>
        <button id="tabSms" class="btn2" type="button" onclick="setMode('sms')">手机号+验证码</button>
      </div>

      <div class="row">
        <input id="phone" placeholder="请输入11位手机号" />
        <input id="password" type="password" placeholder="请输入密码" />
        <div id="smsRow" style="display:none; gap:8px; grid-template-columns:1fr auto;">
          <input id="code" placeholder="6位验证码" />
          <button class="btn2" type="button" onclick="sendSms()">发送验证码</button>
        </div>
        <button class="btn" type="button" onclick="login()">登录</button>
        <div id="msg" class="muted"></div>
      </div>
    </div>
  </div>

<script>
let mode='password';
const phoneRe=/^1\d{10}$/;
function setMode(m){
  mode=m;
  document.getElementById('tabPwd').classList.toggle('active', m==='password');
  document.getElementById('tabSms').classList.toggle('active', m==='sms');
  document.getElementById('password').style.display = m==='password' ? '' : 'none';
  document.getElementById('smsRow').style.display = m==='sms' ? 'grid' : 'none';
  setMsg('', 'muted');
}
function setMsg(t, cls){ const el=document.getElementById('msg'); el.className=cls; el.textContent=t; }
function getPhone(){ return (document.getElementById('phone').value||'').trim(); }
function validatePhone(){
  const p=getPhone();
  if(!phoneRe.test(p)){ setMsg('仅支持中国大陆11位手机号', 'err'); return false; }
  return true;
}
async function sendSms(){
  if(!validatePhone()) return;
  const p=getPhone();
  const r=await fetch('/api/auth/sms/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p})});
  const t=await r.text();
  if(!r.ok){ setMsg('发送失败: '+t, 'err'); return; }
  setMsg('验证码已发送', 'ok');
}
async function login(){
  if(!validatePhone()) return;
  const p=getPhone();
  let body={mode, phone:p};
  if(mode==='password') body.password=(document.getElementById('password').value||'').trim();
  else body.code=(document.getElementById('code').value||'').trim();
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await r.text();
  if(!r.ok){ setMsg('登录失败: '+txt, 'err'); return; }
  try{
    const d=JSON.parse(txt);
    if(d.token) localStorage.setItem('auth_token', d.token);
  }catch(e){}
  setMsg('登录成功', 'ok');
}
</script>
</body>
</html>
