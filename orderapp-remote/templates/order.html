<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>录单</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0;}
    .layout{display:flex; min-height:100vh;}
    .sidebar{width:190px; padding:14px 12px; border-right:1px solid #eee; background:#fafafa; position:sticky; top:0; height:100vh; box-sizing:border-box; overflow:auto;}
    .brand{font-weight:800; margin-bottom:10px;}
    .section{margin-top:14px; margin-bottom:6px; font-size:12px; color:#666;}
    .link{display:block; padding:8px 10px; border-radius:8px; color:#111; text-decoration:none;}
    .link:hover{background:#f0f0f0;}
    .content{flex:1; padding:16px; box-sizing:border-box;}
    .menuBtn{display:none; padding:8px 10px; font-size:18px; border:1px solid #999; background:#fff; border-radius:8px;}
    .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:40;}
    @media (max-width: 820px){
      .layout{display:block;}
      .menuBtn{display:inline-block;}
      .sidebar{width:240px; position:fixed; left:0; top:0; bottom:0; height:100vh; border-right:1px solid #eee; border-bottom:0; transform:translateX(-110%); transition:transform .18s ease; z-index:50; background:#fafafa;}
      .content{padding:12px;}
      body.menuOpen .sidebar{transform:translateX(0);}
      body.menuOpen .overlay{display:block;}

      /* items table -> cards (card view) */
      body.itemsCard .items thead{display:none;}
      body.itemsCard .items tbody tr{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; border:1px solid #eee; border-radius:10px; padding:8px; margin:8px 0;}
      body.itemsCard .items tbody td{display:block; border:0; padding:0; min-width:0;}
      body.itemsCard .items tbody td::before{content:attr(data-label); display:block; font-size:12px; color:#666; margin-bottom:4px;}
      body.itemsCard .items tbody td[data-label=""]::before{display:none;}
      body.itemsCard .items td.p{grid-column:1 / -1;}
      body.itemsCard .items td.s{grid-column:1 / -1;}
      body.itemsCard .items td.spec{grid-column:1;}
      body.itemsCard .items td.qty{grid-column:2;}
      body.itemsCard .items td.unit{grid-column:1;}
      body.itemsCard .items td.weight{grid-column:2;}
      body.itemsCard .items td.settle{grid-column:1 / -1; display:flex; justify-content:flex-end;}
      body.itemsCard .items td.settle .delBtn{padding:8px 10px;}

      /* list view on mobile: two-line per item, 2nd line can scroll */
      body:not(.itemsCard) .items thead{display:none;}
      body:not(.itemsCard) .items tbody tr{display:block; border:1px solid #eee; border-radius:10px; padding:8px; margin:8px 0; overflow-x:auto; -webkit-overflow-scrolling:touch;}
      body:not(.itemsCard) .items tbody td{border:0; padding:6px 0;}
      body:not(.itemsCard) .items td.p{padding-top:0;}

      /* show per-field headers using data-label */
      body:not(.itemsCard) .items td.spec::before,
      body:not(.itemsCard) .items td.qty::before,
      body:not(.itemsCard) .items td.unit::before,
      body:not(.itemsCard) .items td.weight::before{content:attr(data-label); display:block; font-size:12px; color:#666; margin-bottom:4px;}

      /* 2nd line fields: single row + horizontal scroll */
      body:not(.itemsCard) .items tbody tr{white-space:nowrap;}
      body:not(.itemsCard) .items td.spec{min-width:100px;}
      body:not(.itemsCard) .items td.qty{min-width:50px;}
      body:not(.itemsCard) .items td.unit{min-width:50px;}
      body:not(.itemsCard) .items td.weight{min-width:160px;}
      body:not(.itemsCard) .items td.settle{min-width:66px;}
      body:not(.itemsCard) .items td.qty input[name="qty[]"]{width:50px !important; max-width:50px !important;}
      body:not(.itemsCard) .items td.unit select[name="unit[]"]{width:70px !important; max-width:80px !important;}
      body:not(.itemsCard) .items td.spec,
      body:not(.itemsCard) .items td.qty,
      body:not(.itemsCard) .items td.unit,
      body:not(.itemsCard) .items td.weight,
      body:not(.itemsCard) .items td.settle{display:inline-block !important; width:auto !important; vertical-align:top; padding:6px 10px 6px 0; white-space:normal;}
      body:not(.itemsCard) .items td.settle{text-align:left;}
      body:not(.itemsCard) .items td.settle::before{content:"删除"; display:block; font-size:12px; color:#666; margin-bottom:4px;}

      /* 1st line compact */
      body:not(.itemsCard) .items .prodLine{display:grid !important; grid-template-columns:95px 170px 86px; gap:8px; align-items:center;}
      body:not(.itemsCard) .items .prodLine select[name="tier_id[]"]{width:95px !important;}
      body:not(.itemsCard) .items .prodLine .combo{width:170px;}
      body:not(.itemsCard) .items .prodLine .combo input.prod-combo{width:170px; padding-left:10px; padding-right:30px;}
      body:not(.itemsCard) .items .priceBox{font-size:12px; line-height:1.15;}
      body:not(.itemsCard) .items .priceBox span{font-weight:700;}
      body.itemsCard .items .priceBox{margin-top:6px;}
    }
    label{display:block; font-size:14px; margin:10px 0 4px; color:#333;}
    input,select,textarea{width:100%; padding:10px; font-size:16px; box-sizing:border-box;}
    textarea{min-height:70px;}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
    .card{border:1px solid #eee; border-radius:10px; padding:12px; margin:12px 0;}
    .items table{width:100%; border-collapse:collapse;}
    .items th,.items td{border-bottom:1px solid #f1f1f1; padding:8px; text-align:left; vertical-align:top;}
    .items input{padding:8px;}
    .itemsWrap table{min-width:920px;}
    body.itemsCard .itemsWrap table{min-width:0;}
    @media (max-width: 820px){ body:not(.itemsCard) .itemsWrap table{min-width:0;} }

    /* list mode: no freeze */
    .btn{display:inline-block; padding:10px 12px; font-size:16px; border:1px solid #111; background:#111; color:#fff; border-radius:8px;}
    .btn2{display:inline-block; padding:10px 12px; font-size:16px; border:1px solid #999; background:#fff; color:#111; border-radius:8px;}
    .btn2.active{border-color:#111; background:#111; color:#fff;}
    .ok{background:#e9ffe9; border:1px solid #b8f5b8; padding:10px; border-radius:8px;}
    .err{background:#ffecec; border:1px solid #ffb9b9; padding:10px; border-radius:8px;}
  </style>
</head>
<body>
  <div class="overlay" onclick="closeMenu()"></div>
  <div class="layout">
    <nav class="sidebar">
      <div class="brand">ERP</div>
      <div class="section">订单</div>
      <a class="link" href="/order" onclick="saveDraft()">录单</a>
      <a class="link" href="/orders">订单列表</a>
      <div class="section">生产流程</div>
      <div class="section">物料管理</div>
      <a class="link" href="/materials" onclick="saveDraft()">物料档案/库存</a>
      <a class="link" href="/bom-react" onclick="saveDraft()">BOM配方维护</a>
      <a class="link" href="/produce/allocations" onclick="saveDraft()">扣减记录（批次）</a>
      <div class="section">档案</div>
      <a class="link" href="/customers" onclick="saveDraft()">客户档案</a>
      <a class="link" href="/products?from=order" onclick="saveDraft()">商品档案</a>
      <a class="link" href="/products/print" target="_blank" onclick="saveDraft()">报价导出</a>
      <div class="section">日志</div>
      <a class="link" href="/audit" onclick="saveDraft()">操作日志</a>
      <!-- 文档栏目已隐藏（PR-010） -->
      <div class="section">需求管理</div>
      <a class="link" href="/req/product" onclick="saveDraft()">产品需求表</a>
      <a class="link" href="/req/dev" onclick="saveDraft()">开发需求表</a>
      <a class="link" href="/req/unit" onclick="saveDraft()">单元测试表</a>
      <a class="link" href="/req/api" onclick="saveDraft()">API 测试表</a>
      <a class="link" href="/req/review" onclick="saveDraft()">需求审核表</a>
    </nav>
    <main class="content">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <button type="button" class="menuBtn" onclick="toggleMenu()">☰</button>
      <h2 style="margin:0">录单</h2>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn2" href="/products?from=order" onclick="saveDraft()">商品档案</a>
      <a class="btn2" href="/orders">← 订单列表</a>
    </div>
  </div>

  {{if .Ok}}
    <div class="ok">已保存：<b>{{.OrderNo}}</b></div>
  {{end}}
  {{if .Error}}
    <div class="err">{{.Error}}</div>
  {{end}}

  <form method="post" action="/order">
    <div class="card">
      <div class="row">
        <div>
          <label>下单日期</label>
          <input type="date" name="order_date" value="{{.Today}}" />
        </div>
        <div>
          <label>客户</label>
          <div style="display:flex; gap:10px; align-items:center;">
            <div class="combo" style="position:relative; flex:1;">
              <input class="combo-input" placeholder="可选" autocomplete="off"
                onfocus="comboShowAny(this,'customers')" oninput="comboFilterAny(this,'customers')" />
              <button type="button" class="clear" onclick="comboClearAny(this,'customers')" aria-label="清空"
                style="position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; font-size:18px; line-height:1; padding:4px; color:#666;">×</button>
              <div class="dropdown" style="display:none; position:absolute; left:0; right:0; top:100%; z-index:20; background:#fff; border:1px solid #ddd; border-radius:8px; margin-top:6px; max-height:240px; overflow:auto;"></div>
              <input type="hidden" name="customer_id" required />
            </div>
            <a class="btn2" href="/customers/new?from=order" onclick="saveDraft()">+ 新建</a>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>来源</label>
          <div class="combo" style="position:relative;">
            <input class="combo-input" placeholder="可选" autocomplete="off"
              onfocus="comboShowAny(this,'sources')" oninput="comboFilterAny(this,'sources')" />
            <button type="button" class="clear" onclick="comboClearAny(this,'sources')" aria-label="清空"
              style="position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; font-size:18px; line-height:1; padding:4px; color:#666;">×</button>
            <div class="dropdown" style="display:none; position:absolute; left:0; right:0; top:100%; z-index:20; background:#fff; border:1px solid #ddd; border-radius:8px; margin-top:6px; max-height:240px; overflow:auto;"></div>
            <input type="hidden" name="source_id" />
          </div>
        </div>
        <div>
          <label>订单类型</label>
          <div class="combo" style="position:relative;">
            <input class="combo-input" placeholder="可选" autocomplete="off"
              onfocus="comboShowAny(this,'orderTypes')" oninput="comboFilterAny(this,'orderTypes')" />
            <button type="button" class="clear" onclick="comboClearAny(this,'orderTypes')" aria-label="清空"
              style="position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; font-size:18px; line-height:1; padding:4px; color:#666;">×</button>
            <div class="dropdown" style="display:none; position:absolute; left:0; right:0; top:100%; z-index:20; background:#fff; border:1px solid #ddd; border-radius:8px; margin-top:6px; max-height:240px; overflow:auto;"></div>
            <input type="hidden" name="order_type_id" />
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label>快递方式</label>
          <select name="ship_method">
            <option value="">（空）</option>
            <option value="zto">中通</option>
            <option value="sf_large">顺丰大件</option>
            <option value="sf_small">顺丰小件（可拆分）</option>
          </select>
        </div>
        <div>
          <label>物流单号</label>
          <input name="ship_tracking_no" placeholder="例如 SF123... / ZTO..." />
        </div>
      </div>

      <div class="row">
        <div>
          <label>收款状态</label>
          <div class="combo" style="position:relative;">
            <input class="combo-input" placeholder="可选" autocomplete="off"
              onfocus="comboShowAny(this,'payStatuses')" oninput="comboFilterAny(this,'payStatuses')" />
            <button type="button" class="clear" onclick="comboClearAny(this,'payStatuses')" aria-label="清空"
              style="position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; font-size:18px; line-height:1; padding:4px; color:#666;">×</button>
            <div class="dropdown" style="display:none; position:absolute; left:0; right:0; top:100%; z-index:20; background:#fff; border:1px solid #ddd; border-radius:8px; margin-top:6px; max-height:240px; overflow:auto;"></div>
            <input type="hidden" name="pay_status_id" />
          </div>
        </div>
        <div>
          <label>发货状态</label>
          <div class="combo" style="position:relative;">
            <input class="combo-input" placeholder="可选" autocomplete="off"
              onfocus="comboShowAny(this,'shipStatuses')" oninput="comboFilterAny(this,'shipStatuses')" />
            <button type="button" class="clear" onclick="comboClearAny(this,'shipStatuses')" aria-label="清空"
              style="position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; font-size:18px; line-height:1; padding:4px; color:#666;">×</button>
            <div class="dropdown" style="display:none; position:absolute; left:0; right:0; top:100%; z-index:20; background:#fff; border:1px solid #ddd; border-radius:8px; margin-top:6px; max-height:240px; overflow:auto;"></div>
            <input type="hidden" name="ship_status_id" />
          </div>
        </div>
      </div>

      <label>备注</label>
      <textarea name="notes" placeholder="备注..."></textarea>

      <div class="row">
        <div>
          <label>商品金额（自动计算）</label>
          <input id="total_amount" name="total_amount" inputmode="decimal" placeholder="自动" readonly />
        </div>
        <div>
          <label>运费</label>
          <input id="shipping_amount" name="shipping_amount" inputmode="decimal" placeholder="例如 10" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>折扣（金额）</label>
          <input name="discount_amount" inputmode="decimal" placeholder="例如 5" />
        </div>
        <div>
          <label style="margin-bottom:8px;">抹零</label>
          <label style="display:flex; gap:10px; align-items:center; margin:0; font-size:16px;">
            <input type="checkbox" name="round_to_int" value="1" style="width:auto;" />
            抹除小数点（向下取整）
          </label>
        </div>
      </div>

      <label>快递费（文字/补充）</label>
      <input name="express_fee" placeholder="例如 到付/顺丰 18" />
    </div>

    <div class="card items">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px; flex-wrap:wrap;">
        <b>明细</b>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="btnList" type="button" class="btn2 mini" onclick="setItemsView('list')">列表</button>
          <button id="btnCard" type="button" class="btn2 mini" onclick="setItemsView('card')">卡片</button>
          <span id="viewHint" class="muted" style="margin-left:4px;">（当前：-）</span>
          <button type="button" class="btn2" onclick="addRow()">+ 添加一行</button>
        </div>
      </div>

      <div class="itemsWrap" style="overflow:auto; -webkit-overflow-scrolling:touch;">
      <table id="items">
        <thead>
          <tr>
            <th style="width:40%">品名</th>
            <th style="width:18%">规格(g)</th>
            <th style="width:14%">数量(件)</th>
            <th style="width:14%">单位</th>
            <th style="width:18%">总重量</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
      </div>
    </div>

    <button class="btn" type="submit">保存订单</button>
  </form>

<script>
const PRODUCTS = {{.ProductsJSON}};
const OPTS = {
  customers: [{{range .Customers}}{id:"{{.ID}}", name:{{printf "%q" (custShort .Name)}}, py:{{printf "%q" (py (custShort .Name))}}, pyi:{{printf "%q" (pyi (custShort .Name))}}},{{end}}],
  sources: [{{range .Sources}}{id:"{{.ID}}", name:{{printf "%q" .Name}}, py:{{printf "%q" (py .Name)}}, pyi:{{printf "%q" (pyi .Name)}}},{{end}}],
  orderTypes: [{{range .OrderTypes}}{id:"{{.ID}}", name:{{printf "%q" .Name}}, py:{{printf "%q" (py .Name)}}, pyi:{{printf "%q" (pyi .Name)}}},{{end}}],
  payStatuses: [{{range .PayStatuses}}{id:"{{.ID}}", name:{{printf "%q" .Name}}, py:{{printf "%q" (py .Name)}}, pyi:{{printf "%q" (pyi .Name)}}},{{end}}],
  shipStatuses: [{{range .ShipStatuses}}{id:"{{.ID}}", name:{{printf "%q" .Name}}, py:{{printf "%q" (py .Name)}}, pyi:{{printf "%q" (pyi .Name)}}},{{end}}],
};

const PRODUCT_MAP = Object.fromEntries(PRODUCTS.map(p => [String(p.id), p]));

function productOptionsHtml(){
  // kept for backward compatibility (not used now)
  let html = `<option value="">请选择商品</option>`;
  for(const p of PRODUCTS){
    html += `<option value="${p.id}">${p.name}</option>`;
  }
  return html;
}

function tierOptionsHtml(productId){
  const p = PRODUCT_MAP[String(productId)]
  let html = `<option value="auto">自动匹配</option>`;
  if(!p || !p.tiers || p.tiers.length===0){
    html += `<option value="manual">手动单价</option>`;
    return html;
  }
  for(const t of p.tiers){
    const range = t.max==null ? `${t.min}+lb` : `${t.min}-${t.max}lb`;
    html += `<option value="${t.id}" data-price="${t.price}" data-min="${t.min}" data-max="${t.max}">${range}：${t.price.toFixed(2)}/lb</option>`;
  }
  html += `<option value="manual">手动单价</option>`;
  return html;
}

function rowHtml(){
  return `<tr>
    <td class="p" data-label="品名">
      <div class="prodLine" style="display:flex; gap:8px; align-items:center;">
        <select name="tier_id[]" onchange="onTierChange(this)" style="width:118px; flex:0 0 118px;"></select>
        <div class="combo" style="position:relative; flex:1; min-width:0;">
          <input class="prod-combo" placeholder="商品" autocomplete="off"
            onfocus="comboShow(this)" oninput="comboFilter(this)" />
          <button type="button" class="clear" onclick="comboClear(this)" aria-label="清空"
            style="position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; font-size:18px; line-height:1; padding:4px; color:#666;">×</button>
          <div class="dropdown" style="display:none; position:absolute; left:0; right:0; top:100%; z-index:20; background:#fff; border:1px solid #ddd; border-radius:8px; margin-top:6px; max-height:240px; overflow:auto;"></div>
        </div>
        <div class="muted priceBox" style="white-space:nowrap; text-align:right;">
          单价：<span class="price">0.00</span>/lb<br/>总价：<span class="line">0.00</span>
        </div>
      </div>
      <input type="hidden" name="product_id[]" />
      <input name="unit_price[]" inputmode="decimal" placeholder="手动单价（元/磅）" style="margin-top:6px; display:none;" oninput="recalc()" />
    </td>
    <td class="spec" data-label="规格(g)">
      <select name="spec[]" onchange="recalc()">
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="227">227</option>
        <option value="250">250</option>
        <option value="454" selected>454</option>
        <option value="908">908</option>
        <option value="1000">1000</option>
      </select>
    </td>
    <td class="qty" data-label="数量(件)">
      <input name="qty[]" inputmode="numeric" placeholder="件数" oninput="recalc()" style="width:50px; max-width:50px;" />
      <div class="muted" style="margin-top:4px;"><span class="warn" style="color:#b45309;"></span></div>
    </td>
    <td class="unit" data-label="单位">
      <select name="unit[]" onchange="recalc()" style="width:70px; max-width:80px;">
        <option value="袋" selected>袋</option>
        <option value="盒">盒</option>
      </select>
    </td>
    <td class="muted weight" data-label="总重量">
      <span class="totalg">0</span>g / <span class="totallb">0.00</span>lb
    </td>
    <td class="muted settle" data-label="" style="white-space:nowrap;">
      <button type="button" class="btn2 delBtn" onclick="this.closest('tr').remove(); recalc();">删</button>
    </td>
  </tr>`;
}

function normName(s){
  return (s||'')
    .toString()
    .trim()
    .toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[（）()\[\]]/g,'');
}

function rowElsFromInput(inp){
  const tr = inp.closest('tr');
  return {
    tr,
    input: inp,
    hidden: tr.querySelector('input[name="product_id[]"]'),
    tierSel: tr.querySelector('select[name="tier_id[]"]'),
    unitPrice: tr.querySelector('input[name="unit_price[]"]'),
    dropdown: tr.querySelector('.dropdown'),
  };
}

function setUnitOptions(tr){
  const pid = tr.querySelector('input[name="product_id[]"]')?.value || '';
  const p = PRODUCT_MAP[String(pid)] || null;
  const u = tr.querySelector('select[name="unit[]"]');
  if(!u) return;

  const name = (p?.name || '').toString();
  const isDrip = name.includes('挂耳');
  // default: beans etc -> 袋
  const opts = isDrip ? ['袋','盒'] : ['袋'];

  const cur = u.value || '袋';
  u.innerHTML = opts.map(x => `<option value="${x}">${x}</option>`).join('');
  u.value = opts.includes(cur) ? cur : opts[0];
}

function setProductForRow(tr, pid, name){
  const hidden = tr.querySelector('input[name="product_id[]"]');
  const input = tr.querySelector('input.prod-combo');
  const tierSel = tr.querySelector('select[name="tier_id[]"]');
  const up = tr.querySelector('input[name="unit_price[]"]');

  hidden.value = pid || '';
  if(name !== undefined) input.value = name || '';

  tierSel.innerHTML = tierOptionsHtml(pid || '');
  tierSel.value = 'auto';

  up.style.display = 'none';
  up.value = '';

  setUnitOptions(tr);
  recalc();
}

function comboRender(dropdown, kw){
  const k = normName(kw);
  let html = '';
  const list = (!k) ? PRODUCTS : PRODUCTS.filter(p => {
    const n = normName(p.name);
    const py = normName(p.py);
    const pyi = normName(p.pyi);
    return n.includes(k) || py.includes(k) || pyi.includes(k);
  });
  for(const p of list){
    html += `<div class="opt" data-kind="product" data-id="${p.id}" data-name="${encodeURIComponent(p.name)}" style="padding:10px 10px; border-bottom:1px solid #f2f2f2;">${p.name}</div>`;
  }
  if(!html){
    html = `<div class="muted" style="padding:10px;">无匹配商品</div>`;
  }
  dropdown.innerHTML = html;
}

function comboRenderAny(dropdown, kw, key){
  const arr = OPTS[key] || [];
  const k = normName(kw);
  let html = '';
  const list = (!k) ? arr : arr.filter(o => {
    const n = normName(o.name);
    const py = normName(o.py);
    const pyi = normName(o.pyi);
    return n.includes(k) || py.includes(k) || pyi.includes(k);
  });
  for(const o of list){
    html += `<div class="opt" data-kind="any" data-key="${key}" data-id="${o.id}" data-name="${encodeURIComponent(o.name)}" style="padding:10px 10px; border-bottom:1px solid #f2f2f2;">${o.name}</div>`;
  }
  if(!html){
    html = `<div class="muted" style="padding:10px;">无匹配</div>`;
  }
  dropdown.innerHTML = html;
}

function comboShow(inp){
  const {dropdown} = rowElsFromInput(inp);
  comboRender(dropdown, inp.value);
  dropdown.style.display = 'block';
}

function comboHide(inp){
  const {dropdown} = rowElsFromInput(inp);
  dropdown.style.display = 'none';
}

function comboFilter(inp){
  const {dropdown} = rowElsFromInput(inp);
  comboRender(dropdown, inp.value);
  dropdown.style.display = 'block';
  // clear hidden id until user selects an option
  inp.closest('tr').querySelector('input[name="product_id[]"]').value = '';
  recalc();
}

function comboClear(btn){
  const tr = btn.closest('tr');
  setProductForRow(tr, '', '');
  // keep dropdown open to re-select quickly
  const inp = tr.querySelector('input.prod-combo');
  comboShow(inp);
  inp.focus();
}

function anyEls(inp){
  const combo = inp.closest('.combo');
  return {
    combo,
    input: inp,
    dropdown: combo.querySelector('.dropdown'),
    hidden: combo.querySelector('input[type="hidden"]'),
  };
}

function comboShowAny(inp, key){
  const {dropdown} = anyEls(inp);
  comboRenderAny(dropdown, inp.value, key);
  dropdown.style.display='block';
  dropdown.dataset.key = key;
}

function comboFilterAny(inp, key){
  const {dropdown} = anyEls(inp);
  comboRenderAny(dropdown, inp.value, key);
  dropdown.style.display='block';
  dropdown.dataset.key = key;
  // clear value until selected
  anyEls(inp).hidden.value='';
}

function comboClearAny(btn, key){
  const combo = btn.closest('.combo');
  const inp = combo.querySelector('input.combo-input');
  const hidden = combo.querySelector('input[type="hidden"]');
  inp.value='';
  hidden.value='';
  comboShowAny(inp, key);
  inp.focus();
}

// handle option click via event delegation
document.addEventListener('click', (ev) => {
  const opt = ev.target.closest('.dropdown .opt');
  if(!opt) return;

  if(opt.dataset.kind === 'product'){
    const tr = opt.closest('tr');
    setProductForRow(tr, opt.dataset.id, decodeURIComponent(opt.dataset.name || ''));
    const inp = tr.querySelector('input.prod-combo');
    comboHide(inp);
    setTimeout(() => { try{ inp.blur(); }catch(e){} }, 0);
    return;
  }

  if(opt.dataset.kind === 'any'){
    const dropdown = opt.closest('.dropdown');
    const key = dropdown ? (dropdown.dataset.key||'') : '';
    const combo = opt.closest('.combo');
    const inp = combo.querySelector('input.combo-input');
    const hidden = combo.querySelector('input[type="hidden"]');
    inp.value = cleanPicked(decodeURIComponent(opt.dataset.name || ''));
    hidden.value = opt.dataset.id || '';
    combo.querySelector('.dropdown').style.display='none';

    // customer selected -> auto-fill source & order type
    if(key === 'customers' && hidden.value){
      fillFromCustomer(hidden.value);
    }

    try{ saveDraft(); }catch(e){}
    setTimeout(() => { try{ inp.blur(); }catch(e){} }, 0);
    return;
  }
});

// close dropdown when clicking outside
document.addEventListener('click', (ev) => {
  if(ev.target.closest('.combo')) return;
  document.querySelectorAll('.dropdown').forEach(d => d.style.display='none');
});

function cleanPicked(s){
  s = (s||'').toString().trim();
  // strip accidental wrapping quotes
  if((s.startsWith('"') && s.endsWith('"')) || (s.startsWith('“') && s.endsWith('”')) || (s.startsWith('‘') && s.endsWith('’'))){
    s = s.slice(1, -1).trim();
  }
  return s;
}

function findNameById(key, id){
  const arr = OPTS[key] || [];
  const it = arr.find(x => String(x.id) === String(id));
  return it ? it.name : '';
}

function setAnyValue(key, id){
  const name = findNameById(key, id);
  const combo = document.querySelector(`.combo input[type=hidden][name="${key === 'sources' ? 'source_id' : key === 'orderTypes' ? 'order_type_id' : ''}"]`)?.closest('.combo');
  if(!combo) return;
  combo.querySelector('input.combo-input').value = name || '';
  combo.querySelector('input[type="hidden"]').value = id || '';
}

async function fillFromCustomer(customerId){
  try{
    const resp = await fetch(`/customers/${customerId}/prefs`);
    if(!resp.ok) return;
    const p = await resp.json();
    // 覆盖录单里的来源/订单类型
    const sourceCombo = document.querySelector('input[type="hidden"][name="source_id"]').closest('.combo');
    sourceCombo.querySelector('input.combo-input').value = p.default_source_id ? cleanPicked((p.source_name || findNameById('sources', p.default_source_id))) : '';
    sourceCombo.querySelector('input[type="hidden"]').value = p.default_source_id ? String(p.default_source_id) : '';

    const typeCombo = document.querySelector('input[type="hidden"][name="order_type_id"]').closest('.combo');
    typeCombo.querySelector('input.combo-input').value = p.default_order_type_id ? cleanPicked((p.order_type_name || findNameById('orderTypes', p.default_order_type_id))) : '';
    typeCombo.querySelector('input[type="hidden"]').value = p.default_order_type_id ? String(p.default_order_type_id) : '';
  } catch(e){}
}

function onTierChange(sel){
  const tr = sel.closest('tr');
  const unitPriceInput = tr.querySelector('input[name="unit_price[]"]');
  if(sel.value === 'manual'){
    unitPriceInput.style.display = 'block';
  } else {
    unitPriceInput.style.display = 'none';
    unitPriceInput.value = '';
  }
  recalc();
}

const LB_IN_G = 454;

function num(v){
  const x = parseFloat((v||'').toString().trim());
  return isFinite(x) ? x : 0;
}

function intNum(v){
  const n = parseInt((v||'').toString().trim(), 10);
  return isFinite(n) ? n : 0;
}

function matchTierPrice(pid, qtyLb){
  const p = PRODUCT_MAP[String(pid)];
  if(!p || !p.tiers || p.tiers.length===0) return {price:0, minTier:null, matched:null};
  let minTier = p.tiers.reduce((m,t)=>Math.min(m, num(t.min)), Infinity);
  if(!isFinite(minTier)) minTier = null;

  for(const t of p.tiers){
    const min = num(t.min);
    const max = (t.max==null) ? null : num(t.max);
    if(qtyLb >= min && (max==null || qtyLb <= max)) return {price:num(t.price), minTier, matched:t};
  }
  // fallback: highest min <= qty
  let best = null;
  for(const t of p.tiers){
    if(qtyLb >= num(t.min)) best = t;
  }
  if(best) return {price:num(best.price), minTier, matched:best};
  // below minimum tier: use minimum tier price, but warn
  const first = p.tiers.slice().sort((a,b)=>num(a.min)-num(b.min))[0];
  return {price:num(first.price), minTier, matched:null};
}

function recalc(){
  let total = 0;
  document.querySelectorAll('#items tbody tr').forEach(tr => {
    const pid = tr.querySelector('input[name="product_id[]"]').value;
    const specG = intNum(tr.querySelector('select[name="spec[]"]').value);
    const units = intNum(tr.querySelector('input[name="qty[]"]').value);
    const totalG = specG * units;
    const qtyLb = totalG / LB_IN_G;
    const tierSel = tr.querySelector('select[name="tier_id[]"]');
    const unitPriceInput = tr.querySelector('input[name="unit_price[]"]');
    const warn = tr.querySelector('.warn');
    if(warn) warn.textContent = '';

    const tg = tr.querySelector('.totalg');
    const tlb = tr.querySelector('.totallb');
    if(tg) tg.textContent = String(totalG||0);
    if(tlb) tlb.textContent = (qtyLb||0).toFixed(2);

    let price = 0; // 元/磅
    if(tierSel && tierSel.value === 'manual'){
      price = num(unitPriceInput.value);
    } else if(tierSel && tierSel.value && tierSel.value !== 'auto'){
      const opt = tierSel.options[tierSel.selectedIndex];
      price = num(opt?.dataset?.price);
    } else {
      const m = matchTierPrice(pid, qtyLb);
      price = m.price;
      if(m.minTier != null && qtyLb > 0 && qtyLb < m.minTier){
        if(warn) warn.textContent = `低于最低档(${m.minTier}lb)：已按最低档价计算（不阻止）。如需特殊价请选“手动单价”。`;
      }
    }

    tr.querySelector('.price').textContent = price.toFixed(2);
    const line = price * qtyLb;
    tr.querySelector('.line').textContent = line.toFixed(2);
    total += line;
  });
  document.querySelector('#total_amount').value = total.toFixed(2);
}

function addRow(prefill){
  document.querySelector("#items tbody").insertAdjacentHTML("beforeend", rowHtml());
  const tr = document.querySelector('#items tbody tr:last-child');
  // init tier select (no product selected yet)
  const tierSel = tr.querySelector('select[name="tier_id[]"]');
  tierSel.innerHTML = tierOptionsHtml('');
  tierSel.value = 'auto';

  if(prefill){
    tr.querySelector('input.prod-combo').value = prefill.product_name || '';
    tr.querySelector('input[name="product_id[]"]').value = prefill.product_id || '';
    tierSel.innerHTML = tierOptionsHtml(prefill.product_id || '');
    tierSel.value = prefill.tier_id || 'auto';
    const up = tr.querySelector('input[name="unit_price[]"]');
    up.value = prefill.unit_price || '';
    if(tierSel.value === 'manual'){
      up.style.display = 'block';
    } else {
      up.style.display = 'none';
    }
    // item_name removed from UI
    tr.querySelector('input[name="qty[]"]').value = prefill.qty || '';
    // default unit
    const u = tr.querySelector('select[name="unit[]"]');
    if(u) u.value = '袋';
    tr.querySelector('select[name="spec[]"]').value = prefill.spec || '';
  }
}

function saveDraft(){
  try{
    const form = document.querySelector('form');
    const draft = {
      savedAt: Date.now(),
      fields: {
        order_date: form.querySelector('input[name="order_date"]').value,
        customer_id: form.querySelector('input[name="customer_id"]').value,
        source_id: form.querySelector('input[name="source_id"]').value,
        order_type_id: form.querySelector('input[name="order_type_id"]').value,
        pay_status_id: form.querySelector('input[name="pay_status_id"]').value,
        ship_status_id: form.querySelector('input[name="ship_status_id"]').value,
        notes: form.querySelector('textarea[name="notes"]').value,
        shipping_amount: form.querySelector('input[name="shipping_amount"]').value,
        discount_amount: form.querySelector('input[name="discount_amount"]').value,
        round_to_int: form.querySelector('input[name="round_to_int"]').checked ? '1' : '',
        express_fee: form.querySelector('input[name="express_fee"]').value,
      },
      items: Array.from(document.querySelectorAll('#items tbody tr')).map(tr => ({
        product_name: tr.querySelector('input.prod-combo').value,
        product_id: tr.querySelector('input[name="product_id[]"]').value,
        tier_id: tr.querySelector('select[name="tier_id[]"]').value,
        unit_price: tr.querySelector('input[name="unit_price[]"]').value,
        // item_name removed from UI
        qty: tr.querySelector('input[name="qty[]"]').value,
        unit: tr.querySelector('select[name="unit[]"]').value,
        spec: tr.querySelector('select[name="spec[]"]').value,
      }))
    };
    sessionStorage.setItem('order_draft_v1', JSON.stringify(draft));
  }catch(e){}
}

function restoreDraft(){
  try{
    const raw = sessionStorage.getItem('order_draft_v1');
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.fields) return;
    const form = document.querySelector('form');
    form.querySelector('input[name="order_date"]').value = d.fields.order_date || form.querySelector('input[name="order_date"]').value;
    // restore combo fields (find input within same .combo)
    function setAny(nameKey, optKey, id){
      const hidden = form.querySelector(`input[name="${nameKey}"]`);
      if(!hidden) return;
      hidden.value = id || '';
      const combo = hidden.closest('.combo');
      if(!combo) return;
      const inp = combo.querySelector('input.combo-input');
      if(inp) inp.value = findNameById(optKey, id || '');
    }
    setAny('customer_id','customers', d.fields.customer_id);
    setAny('source_id','sources', d.fields.source_id);
    setAny('order_type_id','orderTypes', d.fields.order_type_id);
    setAny('pay_status_id','payStatuses', d.fields.pay_status_id);
    setAny('ship_status_id','shipStatuses', d.fields.ship_status_id);
    form.querySelector('textarea[name="notes"]').value = d.fields.notes || '';
    form.querySelector('input[name="shipping_amount"]').value = d.fields.shipping_amount || '';
    form.querySelector('input[name="discount_amount"]').value = d.fields.discount_amount || '';
    form.querySelector('input[name="round_to_int"]').checked = !!d.fields.round_to_int;
    form.querySelector('input[name="express_fee"]').value = d.fields.express_fee || '';

    // rebuild items
    const tbody = document.querySelector('#items tbody');
    tbody.innerHTML = '';
    const items = (d.items || []).filter(it => (it.product_name||it.item_name||it.qty||it.spec));
    if(items.length===0){
      addRow();
      addRow();
    } else {
      for(const it of items){
        addRow(it);
      }
    }
    recalc();
  }catch(e){}
}

// autosave on page leave
window.addEventListener('beforeunload', saveDraft);

function ensureDefaultShipStatus(){
  const hidden = document.querySelector('input[name="ship_status_id"]');
  if(!hidden || (hidden.value||'').trim()!=='') return;
  const arr = OPTS.shipStatuses || [];
  const hit = arr.find(x => String(x.name||'').trim()==='未发货') || arr.find(x => String(x.name||'').includes('未发货'));
  if(!hit) return;
  hidden.value = String(hit.id);
  const combo = hidden.closest('.combo');
  if(combo){
    const inp = combo.querySelector('input.combo-input');
    if(inp) inp.value = cleanPicked(hit.name||'未发货');
  }
}

restoreDraft();
ensureDefaultShipStatus();
if(document.querySelectorAll('#items tbody tr').length===0){
  addRow();
  addRow();
}
recalc();
</script>

function toggleMenu(){
  document.body.classList.toggle('menuOpen');
}
function closeMenu(){
  document.body.classList.remove('menuOpen');
}
document.addEventListener('click', (e)=>{
  const a = e.target && e.target.closest ? e.target.closest('a.link') : null;
  if(a){ closeMenu(); }
});

function setItemsView(mode){
  if(mode==='card') document.body.classList.add('itemsCard');
  else document.body.classList.remove('itemsCard');
  try{ localStorage.setItem('order_items_view', mode); }catch(e){}
  // visual state
  const bl=document.getElementById('btnList');
  const bc=document.getElementById('btnCard');
  if(bl&&bc){
    bl.classList.toggle('active', mode==='list');
    bc.classList.toggle('active', mode==='card');
  }
  const vh=document.getElementById('viewHint');
  if(vh) vh.textContent = `（当前：${mode==='card'?'卡片':'列表'}）`;
}
// resetItemsView removed
(function initItemsView(){
  // allow forcing via URL: /order?view=list|card
  let mode='list';
  try{
    const u = new URL(location.href);
    const v = (u.searchParams.get('view')||'').trim();
    if(v==='list' || v==='card'){
      mode = v;
      try{ localStorage.setItem('order_items_view', mode); }catch(e){}
    }else{
      mode = localStorage.getItem('order_items_view') || 'list';
    }
  }catch(e){
    try{ mode = localStorage.getItem('order_items_view') || 'list'; }catch(e2){}
  }
  setItemsView(mode);
})();
</script>
