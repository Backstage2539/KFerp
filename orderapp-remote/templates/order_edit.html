<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>编辑订单</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:16px;}
    label{display:block; font-size:14px; margin:10px 0 4px; color:#333;}
    input,textarea,select{width:100%; padding:10px; font-size:16px; box-sizing:border-box;}
    textarea{min-height:70px;}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
    .card{border:1px solid #eee; border-radius:10px; padding:12px; margin:12px 0;}
    .btn{display:inline-block; padding:10px 12px; font-size:16px; border:1px solid #111; background:#111; color:#fff; border-radius:8px;}
    .btn2{display:inline-block; padding:10px 12px; font-size:16px; border:1px solid #999; background:#fff; color:#111; border-radius:8px; text-decoration:none;}
    .muted{color:#666; font-size:13px;}
    .err{background:#ffecec; border:1px solid #ffb9b9; padding:10px; border-radius:8px;}
    table{width:100%; border-collapse:collapse;}
    th,td{border-bottom:1px solid #f1f1f1; padding:8px; text-align:left; font-size:14px;}
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
    <h2 style="margin:0">编辑订单：{{.OrderNo}}</h2>
    <a class="btn2" href="/orders">← 返回列表</a>
  </div>

  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}

  <form method="post" action="/orders/{{.ID}}/edit" oninput="recalcEditTotals()">
    <div class="card">
      <div class="row">
        <div>
          <label>下单日期</label>
          <input type="date" name="order_date" value="{{.OrderDate}}" />
        </div>
        <div>
          <label>客户（ID）</label>
          <input name="customer_id" value="{{.CustomerID}}" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>来源ID（可选）</label>
          <input name="source_id" value="{{.SourceID}}" />
        </div>
        <div>
          <label>订单类型ID（可选）</label>
          <input name="order_type_id" value="{{.OrderTypeID}}" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>收款状态ID（可选）</label>
          <input name="pay_status_id" value="{{.PayStatusID}}" />
        </div>
        <div>
          <label>发货状态ID（可选）</label>
          <input name="ship_status_id" value="{{.ShipStatusID}}" />
        </div>
      </div>

      <label>备注</label>
      <textarea name="notes">{{.Notes}}</textarea>
    </div>

    <div class="card">
      <b>明细（支持改数量/单价，自动重算金额）</b>
      <div style="overflow:auto; margin-top:8px;">
        <table id="editItems">
          <thead>
            <tr>
              <th style="width:60px;">行</th>
              <th>商品</th>
              <th style="width:120px;">规格(g)</th>
              <th style="width:120px;">数量</th>
              <th style="width:100px;">单位</th>
              <th style="width:150px;">单价(元/lb)</th>
              <th style="width:150px;">小计</th>
            </tr>
          </thead>
          <tbody>
            {{range .Items}}
            <tr>
              <td>{{.LineNo}}<input type="hidden" name="item_id[]" value="{{.ItemID}}"/></td>
              <td>{{.Product}}</td>
              <td><input class="spec-g" value="{{.Spec}}" readonly /></td>
              <td><input name="qty[]" value="{{.Qty}}" inputmode="decimal" /></td>
              <td>{{.Unit}}</td>
              <td><input name="unit_price[]" value="{{.UnitPrice}}" inputmode="decimal" /></td>
              <td><span class="line-total">{{.LineTotal}}</span></td>
            </tr>
            {{end}}
            {{if not .Items}}<tr><td colspan="7" class="muted">无明细</td></tr>{{end}}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label>商品金额（自动计算）</label>
          <input id="total_amount" name="total_amount_view" value="{{.TotalAmount}}" readonly />
        </div>
        <div>
          <label>运费</label>
          <input id="shipping_amount" name="shipping_amount" inputmode="decimal" value="{{.ShippingAmount}}" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>折扣</label>
          <input id="discount_amount" name="discount_amount" inputmode="decimal" value="{{.DiscountAmount}}" />
        </div>
        <div>
          <label style="margin-bottom:8px;">抹零</label>
          <label style="display:flex; gap:10px; align-items:center; margin:0; font-size:16px;">
            <input id="round_to_int" type="checkbox" name="round_to_int" value="1" style="width:auto;" {{if .RoundToInt}}checked{{end}} />
            抹除小数点（向下取整）
          </label>
        </div>
      </div>

      <div class="row">
        <div>
          <label>快递费（文字/补充）</label>
          <input name="express_fee" value="{{.ExpressFee}}" />
        </div>
        <div>
          <label>订单合计（自动计算）</label>
          <input id="grand_total_view" value="{{.GrandTotal}}" readonly />
        </div>
      </div>

      <div style="margin-top:12px; display:flex; gap:10px;">
        <button class="btn" type="submit">保存修改</button>
        <a class="btn2" href="/orders">取消</a>
      </div>
    </div>
  </form>

<script>
function num(v){ const n=parseFloat((v||'').toString().trim()); return isFinite(n)?n:0; }
function specG(v){
  let s=(v||'').toString().trim().toLowerCase();
  if(s.endsWith('g')) s=s.slice(0,-1);
  const n=parseFloat(s);
  return isFinite(n)?n:0;
}
function recalcEditTotals(){
  let total=0;
  document.querySelectorAll('#editItems tbody tr').forEach(tr=>{
    const qty=num(tr.querySelector('input[name="qty[]"]')?.value);
    const up=num(tr.querySelector('input[name="unit_price[]"]')?.value);
    const sg=specG(tr.querySelector('.spec-g')?.value);
    const lb=(sg*qty)/454.0;
    const line=lb*up;
    const cell=tr.querySelector('.line-total');
    if(cell) cell.textContent=line.toFixed(2);
    total += line;
  });
  const shipping=num(document.getElementById('shipping_amount')?.value);
  const discount=num(document.getElementById('discount_amount')?.value);
  const round=document.getElementById('round_to_int')?.checked;
  let grand=total+shipping-discount;
  if(round){ grand=Math.floor(grand); }
  document.getElementById('total_amount').value=total.toFixed(2);
  document.getElementById('grand_total_view').value=grand.toFixed(2);
}
window.addEventListener('DOMContentLoaded', recalcEditTotals);
</script>
<div style="display:none">录单人</div></body>
</html>
