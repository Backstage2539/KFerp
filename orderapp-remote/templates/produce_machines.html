<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>设备产能配置</title><style>body{font-family:system-ui;margin:0}.content{padding:16px}.card{border:1px solid #eee;border-radius:8px;padding:12px;margin:12px 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #eee;padding:8px}input{width:100%;padding:6px}.btn{padding:8px 10px;border:1px solid #111;background:#111;color:#fff;border-radius:6px}</style></head><body><main class="content"><h2>设备产能配置</h2>{{if .Ok}}<div>已保存</div>{{end}}<div class="card"><table><thead><tr><th>名称</th><th>容量(g)</th><th>可加工规格(g,逗号分隔)</th><th>最小烘焙量(g)</th><th>启用</th><th></th></tr></thead><tbody>{{range .Rows}}<tr><form method="post" action="/produce/machines/save"><input type="hidden" name="id" value="{{.ID}}"/><td><input name="name" value="{{.Name}}"/></td><td><input name="capacity_g" value="{{.CapacityG}}"/></td><td><input name="allowed_specs" value="{{.AllowedSpecs}}"/></td><td><input name="min_roast_g" value="{{.MinRoastG}}"/></td><td><input name="active" value="{{if .Active}}1{{else}}0{{end}}"/></td><td><button class="btn" type="submit">保存</button></td></form></tr>{{end}}<tr><form method="post" action="/produce/machines/save"><td><input name="name"/></td><td><input name="capacity_g"/></td><td><input name="allowed_specs"/></td><td><input name="min_roast_g"/></td><td><input name="active" value="1"/></td><td><button class="btn" type="submit">新增</button></td></form></tr></tbody></table></div></main></body></html>
