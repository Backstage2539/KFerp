<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>物料准备表（打印）</title>
  <style>
    @page { size: A4; margin: 12mm; }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; color:#111;}
    .meta{font-size:12px; color:#555; margin-bottom:8px;}
    table{width:100%; border-collapse:collapse; margin-top:8px; page-break-inside:auto;}
    tr{page-break-inside:avoid; page-break-after:auto;}
    th,td{border:1px solid #ddd; padding:6px 8px; font-size:12px;}
  </style>
</head>
<body>
  <h2>物料准备表</h2>
  <div class="meta">打印时间：{{.PrintTime}} | 批次：{{.BatchID}} | 区间：{{.From}} ~ {{.To}}</div>
  <table>
    <thead><tr><th>物料</th><th>数量</th><th>单位</th></tr></thead>
    <tbody>
      {{range .Materials}}<tr><td>{{.Name}}</td><td>{{.Qty}}</td><td>{{.Unit}}</td></tr>{{end}}
      {{if not .Materials}}<tr><td colspan="3">暂无数据</td></tr>{{end}}
    </tbody>
  </table>
</body>
</html>
