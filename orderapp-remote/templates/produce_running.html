<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>生产流程</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0;}
    .content{padding:16px;max-width:1200px;margin:0 auto}
    .card{border:1px solid #eee;border-radius:10px;padding:12px;margin:12px 0}
    .btn2{display:inline-block; padding:8px 10px; font-size:14px; border:1px solid #999; background:#fff; color:#111; border-radius:8px; text-decoration:none;}
    .ok{background:#e9ffe9;border:1px solid #b8f5b8;padding:10px;border-radius:8px}
    .err{background:#ffecec;border:1px solid #ffb9b9;padding:10px;border-radius:8px}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th,td{border-bottom:1px solid #f1f1f1;padding:10px 8px;text-align:left;font-size:14px;vertical-align:top}
    .muted{color:#666;font-size:12px}
  </style>
</head>
<body>
<main class="content">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
    <h2 style="margin:0">生产流程（生产中）</h2>
    <div style="display:flex;gap:8px;">
      <a class="btn2" href="/produce/unproduced">← 返回生产计划</a>
      <a class="btn2" href="/products/inventory">成品库存</a>
    </div>
  </div>
  {{if .Ok}}<div class="ok">操作成功</div>{{end}}
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  <div class="card">
    <div class="muted" style="margin-bottom:8px;">点击“完成生产”后，系统将自动增加对应成品库存。</div>
    <div style="overflow:auto;">
      <table>
        <thead>
          <tr><th>批次</th><th>产品</th><th>规格(g)</th><th>计划产量(g)</th><th>订单号</th><th>开始时间</th><th>操作</th></tr>
        </thead>
        <tbody>
          {{range .Rows}}
          <tr>
            <td>{{.BatchID}}</td>
            <td>{{.Product}}</td>
            <td>{{.SpecG}}</td>
            <td>{{.NeedG}}</td>
            <td class="muted">{{.OrderNos}}</td>
            <td>{{.StartedAt}}</td>
            <td>
              <form method="post" action="/produce/running/finish" style="margin:0;">
                <input type="hidden" name="id" value="{{.ID}}" />
                <button class="btn2" type="submit">完成生产</button>
              </form>
            </td>
          </tr>
          {{end}}
          {{if not .Rows}}<tr><td colspan="7" class="muted">当前无生产中任务</td></tr>{{end}}
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
