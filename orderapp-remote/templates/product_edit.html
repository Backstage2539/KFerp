<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>编辑商品</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:16px;}
    .card{border:1px solid #eee; border-radius:10px; padding:12px; margin:12px 0;}
    .btn{display:inline-block; padding:10px 12px; font-size:16px; border:1px solid #111; background:#111; color:#fff; border-radius:8px; text-decoration:none;}
    .btn2{display:inline-block; padding:10px 12px; font-size:16px; border:1px solid #999; background:#fff; color:#111; border-radius:8px; text-decoration:none;}
    input{width:100%; padding:10px; font-size:16px; box-sizing:border-box;}
    table{width:100%; border-collapse:collapse;}
    th,td{border-bottom:1px solid #f1f1f1; padding:10px 8px; text-align:left; font-size:14px;}
    .muted{color:#666; font-size:13px;}
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
    <h2 style="margin:0">编辑：{{.Name}}</h2>
    <a class="btn2" href="/products">← 返回</a>
  </div>

  <form method="post" action="/products/{{.ID}}">
    <div class="card">
      <div class="muted" style="margin-bottom:8px;">录单选择“零售”时优先使用对应规格零售价；未配置的规格回退到 227g 折算并向上取整。</div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;">
        <div>
          <label>零售价（元 / 100g）</label>
          <input name="retail_price_100g" value="{{printf "%.2f" .RetailPrice100G}}" inputmode="decimal" />
        </div>
        <div>
          <label>零售价（元 / 200g）</label>
          <input name="retail_price_200g" value="{{printf "%.2f" .RetailPrice200G}}" inputmode="decimal" />
        </div>
        <div>
          <label>零售价（元 / 227g）</label>
          <input name="retail_price_227g" value="{{printf "%.2f" .RetailPrice227G}}" inputmode="decimal" />
        </div>
        <div>
          <label>零售价（元 / 250g）</label>
          <input name="retail_price_250g" value="{{printf "%.2f" .RetailPrice250G}}" inputmode="decimal" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="muted" style="margin-bottom:8px;">批发阶梯价按规格克重 + 件数区间配置，单价单位：元 / 件。</div>
      <table id="tiers">
        <thead>
          <tr>
            <th style="width:16%">规格(g)</th>
            <th style="width:18%">起始(件)</th>
            <th style="width:18%">结束(件)</th>
            <th style="width:22%">单价(元/件)</th>
            <th style="width:18%">启用</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {{range .Tiers}}
          <tr>
            <td><input name="tier_spec_g[]" value="{{.SpecG}}" /></td>
            <td><input name="min[]" value="{{printf "%.0f" .MinQty}}" /></td>
            <td><input name="max[]" value="{{if .MaxQty}}{{f0p .MaxQty}}{{end}}" placeholder="空=无上限" /></td>
            <td><input name="price[]" value="{{printf "%.2f" .UnitPrice}}" /></td>
            <td><input type="checkbox" name="active[]" value="1" checked /></td>
            <td><button type="button" class="btn2" onclick="this.closest('tr').remove()">删</button></td>
          </tr>
          {{end}}
        </tbody>
      </table>

      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
        <button type="button" class="btn2" onclick="addRow()">+ 添加档位</button>
        <button class="btn" type="submit">保存</button>
      </div>
      <div class="muted" style="margin-top:8px;">提示：同一商品可以同时配置 454g、227g、100g 等规格；录单自动按当前规格匹配。</div>
    </div>
  </form>

<script>
function addRow(){
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input name="tier_spec_g[]" placeholder="例如 454" /></td>
    <td><input name="min[]" placeholder="例如 2" /></td>
    <td><input name="max[]" placeholder="例如 13（空=无上限）" /></td>
    <td><input name="price[]" placeholder="例如 88.00" /></td>
    <td><input type="checkbox" name="active[]" value="1" checked /></td>
    <td><button type="button" class="btn2" onclick="this.closest('tr').remove()">删</button></td>
  `;
  document.querySelector('#tiers tbody').appendChild(tr);
}
</script>
</body>
</html>
