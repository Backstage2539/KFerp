<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{.Title}}</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0;}
    .layout{display:flex; min-height:100vh;}
    .sidebar{width:190px; padding:14px 12px; border-right:1px solid #eee; background:#fafafa; position:sticky; top:0; height:100vh; box-sizing:border-box; overflow:auto;}
    .brand{font-weight:800; margin-bottom:10px;}
    .section{margin-top:14px; margin-bottom:6px; font-size:12px; color:#666;}
    .link{display:block; padding:8px 10px; border-radius:8px; color:#111; text-decoration:none;}
    .link:hover{background:#f0f0f0;}
    .content{flex:1; padding:16px; box-sizing:border-box;}
    .menuBtn{display:none; padding:8px 10px; font-size:18px; border:1px solid #999; background:#fff; border-radius:8px;}
    .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:40;}
    @media (max-width: 820px){
      .layout{display:block;}
      .menuBtn{display:inline-block;}
      .sidebar{width:240px; position:fixed; left:0; top:0; bottom:0; height:100vh; border-right:1px solid #eee; border-bottom:0; transform:translateX(-110%); transition:transform .18s ease; z-index:50; background:#fafafa;}
      .content{padding:12px;}
      body.menuOpen .sidebar{transform:translateX(0);}
      body.menuOpen .overlay{display:block;}
    }
    .card{border:1px solid #eee; border-radius:10px; padding:12px; margin:12px 0;}
    .muted{color:#666; font-size:12px;}
    .pill{display:inline-block; padding:2px 8px; border:1px solid #ddd; border-radius:999px; font-size:12px; color:#555; background:#fff;}
  </style>
</head>
<body>
  <div class="overlay" onclick="closeMenu()"></div>
  <div class="layout">
    <nav class="sidebar">
      <div class="brand">ERP</div>
      <div class="section">订单</div>
      <a class="link" href="/order">录单</a>
      <a class="link" href="/orders">订单列表</a>
      <div class="section">档案</div>
      <a class="link" href="/customers">客户档案</a>
      <a class="link" href="/products">商品档案</a>
      <a class="link" href="/products/print" target="_blank">报价导出</a>
      <div class="section">日志</div>
      <a class="link" href="/audit">操作日志</a>
      <div class="section">文档</div>
      <a class="link" href="/docs">需求/验收</a>
      <div class="section">需求管理</div>
      <a class="link" href="/req/product">产品需求表</a>
      <a class="link" href="/req/dev">开发需求表</a>
      <a class="link" href="/req/unit">单元测试表</a>
      <a class="link" href="/req/api">API 测试表</a>
      <a class="link" href="/req/review">需求审核表</a>
    </nav>
    <main class="content">

  <div style="display:flex; align-items:center; gap:10px;">
    <button type="button" class="menuBtn" onclick="toggleMenu()">☰</button>
    <h2 style="margin:0">{{.Title}} <span class="pill">stub</span></h2>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px;">说明：此页面先用于“可访问/可导航”。下一步会接入真实数据表（增删改查）与审计。</div>
    <ul>
      <li><b>用途：</b>需求完成后逐条审核（通过/不通过/证据）</li>
      <li><b>下一步：</b>关联到“产品需求/开发需求/测试表”，一键生成审核项</li>
    </ul>
  </div>

<script>
function toggleMenu(){ document.body.classList.toggle('menuOpen'); }
function closeMenu(){ document.body.classList.remove('menuOpen'); }
document.addEventListener('click', (e)=>{
  const a = e.target && e.target.closest ? e.target.closest('a.link') : null;
  if(a){ closeMenu(); }
});
</script>

    </main>
  </div>
</body>
</html>
