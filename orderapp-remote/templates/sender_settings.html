<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>发货人设置</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:16px;}
    label{display:block; margin:8px 0 4px; color:#333;}
    input{width:100%; padding:10px; box-sizing:border-box;}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
    .btn{display:inline-block; padding:10px 12px; border:1px solid #111; background:#111; color:#fff; border-radius:8px;}
    .btn2{display:inline-block; padding:10px 12px; border:1px solid #999; background:#fff; color:#111; border-radius:8px; text-decoration:none;}
    .ok{background:#ecfdf5; border:1px solid #86efac; padding:10px; border-radius:8px; margin:10px 0;}
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
    <h2 style="margin:0">发货人设置</h2>
    <a class="btn2" href="/orders">← 返回订单</a>
  </div>
  {{if .Ok}}<div class="ok">保存成功</div>{{end}}
  <form method="post" action="/settings/sender">
    <div class="row">
      <div><label>发件人姓名</label><input name="sender_name" value="{{.P.Name}}"/></div>
      <div><label>发件人电话</label><input name="sender_phone" value="{{.P.Phone}}"/></div>
    </div>
    <label>发件地址</label><input name="sender_addr" value="{{.P.Addr}}"/>
    <div class="row">
      <div><label>发件公司</label><input name="sender_company" value="{{.P.Company}}"/></div>
      <div><label>托寄物</label><input name="sender_goods" value="{{.P.Goods}}"/></div>
    </div>
    <label>业务类型</label><input name="sf_biz_type" value="{{.P.BizType}}"/>
    <div style="margin-top:12px;"><button class="btn" type="submit">保存</button></div>
  </form>
</body>
</html>
