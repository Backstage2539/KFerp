version: "3.9"

services:
  traefik:
    image: traefik:v3.4
    container_name: roastery-traefik
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # DNSPod DNS-01 credentials (lego)
      - DNSPOD_API_ID=${DNSPOD_API_ID}
      - DNSPOD_API_KEY=${DNSPOD_API_KEY}
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "8765:8765"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme:/acme
    labels:
      - traefik.enable=true
      # Dashboard (optional): https://erp.stopcloud.site:8765/traefik
      - traefik.http.routers.traefik.rule=Host(`${DOMAIN}`) && PathPrefix(`/traefik`)
      - traefik.http.routers.traefik.entrypoints=websecure8765
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.certresolver=le
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.middlewares.traefik-strip.stripprefix.prefixes=/traefik
      - traefik.http.routers.traefik.middlewares=traefik-strip

  postgres:
    image: postgres:16
    container_name: roastery-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: ghcr.io/openclaw/placeholder:latest
    container_name: roastery-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure8765
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=8080

  admin:
    image: ghcr.io/openclaw/placeholder:latest
    container_name: roastery-admin
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`${DOMAIN}`) && PathPrefix(`/admin`)
      - traefik.http.routers.admin.entrypoints=websecure8765
      - traefik.http.routers.admin.tls=true
      - traefik.http.routers.admin.tls.certresolver=le
      - traefik.http.services.admin.loadbalancer.server.port=3000

  portal:
    image: ghcr.io/openclaw/placeholder:latest
    container_name: roastery-portal
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.portal.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.portal.entrypoints=websecure8765
      - traefik.http.routers.portal.tls=true
      - traefik.http.routers.portal.tls.certresolver=le
      - traefik.http.services.portal.loadbalancer.server.port=3000

volumes:
  pgdata:
