log:
  level: INFO

api:
  dashboard: true
  insecure: false

entryPoints:
  websecure8765:
    address: ":8765"

providers:
  docker:
    exposedByDefault: false

certificatesResolvers:
  le:
    acme:
      email: ${ACME_EMAIL}
      storage: /acme/acme.json
      dnsChallenge:
        provider: dnspod
        # DNS propagation can be slow for some ISPs
        delayBeforeCheck: 10
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
